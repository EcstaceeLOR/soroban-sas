name: Branch format 242

on:
  push:
    branches:
      - feat/242-validate-attester-address

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/242-validate-attester-address
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.79.0
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatter output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add contracts/sas/src/lib.rs contracts/sas/src/test_issue_242.rs
          if ! git diff --cached --quiet; then
            git commit -m 'style: apply cargo fmt for issue 242'
            git push origin HEAD:feat/242-validate-attester-address
          fi
